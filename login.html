<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zenith Global</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <img src="assets/logo/logo.png" alt="Zenith Global Logo" class="logo">
        <h2>Login to Account</h2>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <button type="submit" id="loginBtn">Login Now</button>
        </form>

        <p style="margin-top: 15px;">
            <a href="forgot-password.html">Forgot Password?</a>
        </p>
        <p>Don't have an account? <a href="register.html">Create a new account</a></p>
    </div>
    <script type="module" src="js/auth/login.js"></script>
</body>
</html>
