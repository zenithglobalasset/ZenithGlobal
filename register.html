<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Zenith Global</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 10px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 100px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="logo.png" class="logo">
        <form id="regForm">
            <input type="text" id="fname" placeholder="First Name" required>
            <input type="text" id="lname" placeholder="Last Name" required>
            <select id="country" required><option value="">Select Country</option></select>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <script>
        // কান্ট্রি লিস্ট লোড
        fetch('https://restcountries.com/v3.1/all').then(res => res.json()).then(data => {
            const s = document.getElementById("country");
            data.sort((a,b) => a.name.common.localeCompare(b.name.common)).forEach(c => {
                s.innerHTML += `<option value="${c.name.common}">${c.name.common}</option>`;
            });
        });

        // রেজিস্ট্রেশন সাবমিট
        document.getElementById("regForm").addEventListener("submit", (e) => {
            e.preventDefault();
            alert("Registration logic will be linked here.");
        });
    </script>
</body>
</html>
