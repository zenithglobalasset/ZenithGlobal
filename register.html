<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Zenith Global</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <img src="assets/logo/logo.png" alt="Zenith Global Logo" class="logo">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <select id="country" required><option value="">Loading...</option></select>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone" required>
            <input type="password" id="password" placeholder="Password" required>
            <div class="captcha-box">
                <span id="captchaText"></span>
                <button type="button" id="refreshCaptcha">🔄</button>
            </div>
            <input type="text" id="captchaInput" placeholder="Enter Captcha" required>
            <button type="submit">Create Account</button>
        </form>
    </div>
    <script type="module" src="js/auth/register.js"></script>
</body>
</html>
